<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="assets/css/styles.css">
        <title>Desafio Dev 2</title>
    </head>
    <div id="layout">
        <header>
            <h1>Desafio da Comunidade 2</h1>
        </header>
        <main>
            <section class="desafio">
                <header>
                    <h2>Desafio 1: Botão com animação ao passar o rato</h2>
                </header>
                <button class="btn">Passar o rato aqui</button>
            </section>
            <section class="desafio">
                <header>
                    <h2>Desafio 2: Texto com animação de digitação</h2>
                </header>
                <p>Olá eu sou um texto animado!</p>
            </section>
            <section class="desafio">
                <header>
                    <h2>Desafio 3: Loader com CSS Puro</h2>
                </header>
                <div class="container-loader">
                    <div class="loader"></div>
                </div>
            </section>
            <section class="desafio-4">
                <header>
                    <h2>Desafio 4: Cartão com animação de virar</h2>
                </header>
                <div class="container-card">
                <div class="flip-card">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <h2>Frente</h2>
                            <p>Passe o rato para ver o verso</p>
                        </div>
                        <div class="flip-card-back">
                            <h2>Verso</h2>
                            <p>Surpresa!</p>
                        </div>
                    </div>
                </div>
            </div>
            </section>
        </main>
    </div>
</html>
